<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Restrito - ICM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #fff5f5; 
        color: #1e293b; 
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-[#fff5f5] flex items-center justify-center p-6">
      <div class="w-full max-w-sm bg-white rounded-[2rem] shadow-2xl p-8 border border-red-50">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-red-100 rounded-2xl flex items-center justify-center text-[#8f1919] mx-auto mb-4">
            <i class="fas fa-lock text-2xl"></i>
          </div>
          <h2 class="text-2xl font-bold text-[#8f1919]">Acesso Restrito</h2>
          <p class="text-red-400 text-sm">Área de Configuração Global</p>
        </div>

        <form id="login-form" class="space-y-4">
          <div>
            <label class="text-[10px] font-bold text-red-300 uppercase ml-1">Usuário</label>
            <input 
              type="text" 
              id="user-input"
              required
              class="w-full bg-red-50/50 border border-red-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-red-200 transition-all"
            />
          </div>
          <div>
            <label class="text-[10px] font-bold text-red-300 uppercase ml-1">Senha</label>
            <input 
              type="password" 
              id="pass-input"
              required
              class="w-full bg-red-50/50 border border-red-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-red-200 transition-all"
            />
          </div>

          <p id="error-msg" class="text-center text-red-600 text-xs font-bold hidden animate-bounce">Credenciais Inválidas!</p>

          <button 
            type="submit"
            class="w-full bg-[#8f1919] text-white font-bold py-4 rounded-xl shadow-lg hover:bg-red-800 active:scale-95 transition-all"
          >
            Entrar
          </button>
          
          <a 
            href="/index.html"
            class="w-full text-red-300 text-xs font-bold uppercase py-2 block text-center mt-2"
          >
            Voltar
          </a>
        </form>
      </div>
    </div>

    <script type="module" src="/login.ts"></script>
  </body>
</html>
