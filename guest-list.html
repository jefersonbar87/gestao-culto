<!DOCTYPE html>
<html lang="pt-BR" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Convidados - Trombetas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d2f40;
      /* Fundo azul escuro premium */
      color: #1e293b;
    }

    .input-border {
      border: 1px solid #7dd3fc;
    }

    /* Ajuste fino para a rolagem da tabela */
    .table-container::-webkit-scrollbar {
      width: 6px;
    }

    .table-container::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center pt-8 pb-12 px-4">

  <div class="text-center mb-8">
    <h1 class="text-3xl font-black text-white mb-2 tracking-wide">Lista de Convidados</h1>
    <h2 class="text-lg font-medium text-white">Trombetas e Festas 2026</h2>
  </div>

  <div class="w-full max-w-3xl space-y-5">

    <div class="bg-white rounded-xl shadow-lg p-6">
      <h3 class="text-[#0d2f40] font-bold text-lg flex items-center gap-2 mb-4">
        <i class="far fa-calendar-alt"></i> Informações do Evento
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="text-xs font-bold text-[#0d2f40] block mb-1">Data do Evento *</label>
          <input type="date" id="event-date"
            class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm focus:ring-2 focus:ring-[#0d2f40]/20" />
        </div>
        <div>
          <label class="text-xs font-bold text-[#0d2f40] block mb-1"><i class="far fa-clock"></i> Horário do
            Evento</label>
          <input type="time" id="event-time"
            class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm focus:ring-2 focus:ring-[#0d2f40]/20" />
        </div>
        <div>
          <label class="text-xs font-bold text-[#0d2f40] block mb-1">Convidados de:</label>
          <input type="text" id="event-inviter" placeholder="OPCIONAL"
            class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm uppercase placeholder-slate-400 focus:ring-2 focus:ring-[#0d2f40]/20" />
        </div>
      </div>
    </div>

    <form id="form-guest" class="bg-white rounded-xl shadow-lg p-6">
      <h3 class="text-[#0d2f40] font-bold text-lg flex items-center gap-2 mb-4">
        <i class="fas fa-user-plus"></i> Adicionar Convidado
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="text-xs font-bold text-[#0d2f40] block mb-1"><i class="far fa-user"></i> Nome do Convidado
            *</label>
          <input type="text" id="guest-name" required placeholder="NOME COMPLETO"
            class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm uppercase placeholder-slate-400 focus:ring-2 focus:ring-[#0d2f40]/20" />
        </div>
        <div>
          <label class="text-xs font-bold text-[#0d2f40] block mb-1"><i class="fas fa-phone-alt text-[10px]"></i>
            Telefone</label>
          <input type="tel" id="guest-phone" placeholder="(11) 99999-9999"
            class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm placeholder-slate-400 focus:ring-2 focus:ring-[#0d2f40]/20" />
        </div>
      </div>
      <button type="submit"
        class="w-full bg-[#0d2f40] text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-[#09222e] transition-colors shadow-md">
        <i class="fas fa-user-plus"></i> Adicionar Convidado
      </button>
    </form>

    <div class="bg-white rounded-xl shadow-lg p-6">
      <div class="flex flex-wrap justify-between items-center gap-4 mb-4 border-b pb-3">
        <h3 class="text-[#0d2f40] font-bold text-lg flex items-center gap-2 whitespace-nowrap">
          <i class="far fa-user shrink-0"></i> Lista de Convidados (<span id="guest-count">0</span>)
        </h3>
        <button id="btn-clear-guests"
          class="bg-red-50 text-red-500 hover:bg-red-100 px-3 py-1.5 rounded text-xs font-bold transition-colors flex items-center gap-2 shrink-0">
          <i class="far fa-trash-alt"></i> Limpar Lista
        </button>
      </div>

      <div class="w-full overflow-x-auto table-container max-h-60">
        <table class="w-full border-collapse border border-slate-300 text-sm text-center min-w-[500px]">
          <thead class="text-[#0d2f40] font-bold sticky top-0 bg-white shadow-sm">
            <tr>
              <th class="border border-slate-300 p-2.5 w-12">Nº</th>
              <th class="border border-slate-300 p-2.5 text-left">Nome do Convidado</th>
              <th class="border border-slate-300 p-2.5 text-[#c2410c] w-40">Telefone</th>
              <th class="border border-slate-300 p-2.5 w-20">Ações</th>
            </tr>
          </thead>
          <tbody id="guests-list" class="bg-white">
          </tbody>
        </table>
      </div>
    </div>

    <button id="btn-generate-image"
      class="w-full bg-[#dc2626] text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center gap-2 hover:bg-red-700 transition-colors">
      <i class="far fa-image"></i> Gerar Imagem
    </button>

    <div id="image-preview-section" class="w-full bg-white rounded-xl shadow-lg p-6 hidden">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 class="text-[#0d2f40] font-bold text-lg">Imagem Gerada</h3>
        <button id="btn-close-preview"
          class="w-7 h-7 bg-red-50 text-red-500 rounded-full flex items-center justify-center hover:bg-red-100 transition-colors">
          <i class="fas fa-times text-xs"></i>
        </button>
      </div>
      <div class="bg-slate-50 border border-slate-200 p-2 flex justify-center mb-4 rounded">
        <img id="generated-image" class="max-w-full h-auto shadow-sm rounded border border-slate-300" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button id="btn-whatsapp"
          class="bg-[#22c55e] text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-green-600 transition-colors">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </button>
        <button id="btn-download"
          class="bg-[#3b82f6] text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-blue-600 transition-colors">
          <i class="fas fa-download"></i> Baixar
        </button>
      </div>
    </div>

    <div class="pt-2">
      <a href="/trombetas.html"
        class="w-full bg-white text-[#0d2f40] font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors shadow-md">
        <i class="fas fa-arrow-left"></i> Voltar
      </a>
    </div>

  </div>

  <script type="module" src="/guest-list.ts"></script>
</body>

</html>
