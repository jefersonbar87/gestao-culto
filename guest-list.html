<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Convidados - ICM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #f8fafc; 
        color: #1e293b; 
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-slate-50 flex flex-col items-center pt-8 pb-12 px-4">
      <header class="w-full max-w-2xl flex items-center gap-4 mb-8">
        <a href="/trombetas.html" class="text-[#8f1919] p-2 bg-white rounded-full shadow-sm flex items-center justify-center w-10 h-10">
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-2xl font-bold text-[#8f1919] uppercase">Lista de Convidados</h1>
      </header>

      <div class="bg-white rounded-3xl shadow-xl w-full max-w-2xl p-6 md:p-8 space-y-6">
        <!-- Guest Add Form -->
        <form id="form-guest" class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-4">
          <h3 class="font-bold text-[#8f1919] text-sm uppercase">Adicionar Novo Convidado</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Nome Completo</label>
              <input type="text" id="guest-name" required class="w-full bg-white border border-slate-200 rounded-xl p-2.5 outline-none text-sm uppercase" placeholder="Nome do convidado" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Quem Convidou</label>
              <input type="text" id="guest-invited-by" required class="w-full bg-white border border-slate-200 rounded-xl p-2.5 outline-none text-sm uppercase" placeholder="Nome de quem convidou" />
            </div>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4 text-xs font-bold text-[#8f1919]">
              <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="radio" name="guestType" id="type-adult" checked /> Adulto
              </label>
              <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="radio" name="guestType" id="type-child" /> Criança
              </label>
            </div>
            <button type="submit" class="bg-[#8f1919] text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase shadow-md active:scale-95 transition-all">
              <i class="fas fa-plus mr-1.5"></i> Adicionar
            </button>
          </div>
        </form>

        <!-- List Stats -->
        <div class="grid grid-cols-4 gap-2 text-center">
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <span class="block font-black text-lg text-slate-700" id="stat-total">0</span>
            <span class="text-[9px] font-bold text-slate-400 uppercase block">Total</span>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <span class="block font-black text-lg text-slate-700" id="stat-adults">0</span>
            <span class="text-[9px] font-bold text-slate-400 uppercase block">Adultos</span>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <span class="block font-black text-lg text-slate-700" id="stat-kids">0</span>
            <span class="text-[9px] font-bold text-slate-400 uppercase block">Crianças</span>
          </div>
          <div class="bg-red-50 p-2.5 rounded-xl border border-red-100">
            <span class="block font-black text-lg text-[#8f1919]" id="stat-confirmed">0</span>
            <span class="text-[9px] font-bold text-[#8f1919] uppercase block">Confirmados</span>
          </div>
        </div>

        <!-- Filter Controls -->
        <div class="flex flex-wrap gap-1.5 border-b pb-3">
          <button id="filter-all" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase bg-red-50 text-red-700 border border-red-100">Todos</button>
          <button id="filter-adult" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase bg-slate-50 text-slate-500 hover:bg-slate-100">Adultos</button>
          <button id="filter-child" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase bg-slate-50 text-slate-500 hover:bg-slate-100">Crianças</button>
          <button id="filter-confirmed" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase bg-slate-50 text-slate-500 hover:bg-slate-100">Confirmados</button>
          <button id="filter-pending" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase bg-slate-50 text-slate-500 hover:bg-slate-100">Pendentes</button>
        </div>

        <div class="flex justify-between items-center text-xs">
          <button id="btn-export-txt" class="text-blue-600 font-bold uppercase hover:underline"><i class="fas fa-file-export mr-1"></i> Exportar (.txt)</button>
          <button id="btn-clear-guests" class="text-red-600 font-bold uppercase hover:underline"><i class="fas fa-trash-alt mr-1"></i> Limpar Lista</button>
        </div>

        <!-- Scrollable Guest List Table -->
        <div class="border rounded-2xl overflow-hidden max-h-96 overflow-y-auto">
          <table class="w-full text-left border-collapse text-sm bg-white">
            <thead class="bg-slate-50 border-b">
              <tr>
                <th class="p-3 font-bold text-slate-500 text-xs uppercase">Nome</th>
                <th class="p-3 font-bold text-slate-500 text-xs uppercase">Tipo</th>
                <th class="p-3 font-bold text-slate-500 text-xs uppercase">Quem Convidou</th>
                <th class="p-3 font-bold text-slate-500 text-xs uppercase text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="guests-tbody" class="divide-y">
              <!-- Rendered via script -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="w-full max-w-2xl mt-6">
        <a href="/trombetas.html" class="w-full bg-white text-[#8f1919] font-bold py-3 rounded-xl border border-red-200 block text-center shadow-sm">Voltar</a>
      </div>
    </div>

    <script type="module" src="/guest-list.ts"></script>
  </body>
</html>
