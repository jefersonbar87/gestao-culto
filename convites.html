<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convites - Gestão Culto Profético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #fff5f5; 
        color: #1e293b; 
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-[#fff5f5] flex flex-col items-center pt-8 pb-12 px-6">
      <header class="w-full max-w-md flex items-center gap-4 mb-8">
        <a href="/home.html" class="text-[#8f1919] p-2 bg-white rounded-full shadow-sm flex items-center justify-center w-10 h-10">
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-2xl font-bold text-[#8f1919] uppercase">Convites</h1>
      </header>

      <div class="max-w-md w-full space-y-5">
        
        <div class="w-full bg-white p-6 rounded-[1.8rem] shadow-md text-left flex items-center gap-5 border border-white/50">
          <div class="w-16 h-16 rounded-2xl bg-red-100 flex items-center justify-center text-[#8f1919] shrink-0">
            <i class="fas fa-envelope-open-text text-2xl"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-2xl font-bold text-[#8f1919] leading-tight">Criação de Convites</h3>
            <p class="text-red-400 text-base font-medium">Em breve</p>
          </div>
        </div>

      </div>

      <div class="max-w-md w-full mt-8">
        <a href="/home.html" class="w-full bg-white text-[#8f1919] font-bold py-3 rounded-xl border border-red-200 block text-center shadow-sm">Voltar ao Início</a>
      </div>
    </div>
  </body>
</html>
