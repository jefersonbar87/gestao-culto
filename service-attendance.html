<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Presença - ICM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #fce7f3; 
        color: #1e293b; 
      }
      /* Estilo ativo garantido para o botão selecionado */
      .cult-type-btn.active {
        background-color: #8f1919 !important;
        color: white !important;
        border-color: #8f1919 !important;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center py-8 px-4">
    
    <h1 class="text-3xl font-black text-[#8f1919] mb-6 text-center leading-tight">Lista de<br>Presença</h1>

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 md:p-8 space-y-8 border-t-4 border-[#8f1919]">
      
      <div class="flex flex-col items-center text-center">
        <h2 class="font-bold text-[#8f1919] text-lg mb-2">Data do Culto</h2>
        <input type="date" id="input-date" class="w-64 border border-[#8f1919] text-[#8f1919] font-bold rounded-lg p-2 text-center outline-none focus:ring-2 focus:ring-red-200" />
        <div id="date-display" class="mt-2 text-xs font-bold text-[#8f1919] bg-red-50 py-1 px-4 rounded-md uppercase">
          Hoje: 
        </div>
      </div>

      <div class="text-center">
        <h2 class="font-bold text-[#8f1919] text-lg mb-2">Tipo de Culto</h2>
        <div class="grid grid-cols-2 gap-3">
          <button id="btn-type-ebd" class="cult-type-btn border border-[#8f1919] text-[#8f1919] font-bold rounded-lg py-3 hover:bg-red-50 transition-colors uppercase text-xs">EBD</button>
          <button id="btn-type-night" class="cult-type-btn border border-[#8f1919] text-[#8f1919] font-bold rounded-lg py-3 hover:bg-red-50 transition-colors uppercase text-xs">Culto à Noite</button>
          <button id="btn-type-dawn" class="cult-type-btn border border-[#8f1919] text-[#8f1919] font-bold rounded-lg py-3 hover:bg-red-50 transition-colors uppercase text-xs">Madrugada</button>
          <button id="btn-type-noon" class="cult-type-btn border border-[#8f1919] text-[#8f1919] font-bold rounded-lg py-3 hover:bg-red-50 transition-colors uppercase text-xs">Culto ao Meio-Dia</button>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-[#8f1919] text-lg">Equipe e Obreiros</h2>
          <button id="btn-add-person" class="bg-green-100 text-green-700 hover:bg-green-200 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors">
            <i class="fas fa-plus"></i> Adicionar
          </button>
        </div>
        
        <div id="people-list" class="space-y-3">
          </div>

        <div class="bg-yellow-50 border border-yellow-200 text-yellow-700 text-xs font-bold p-3 rounded-lg mt-4 text-center">
          💡 Dica: Escreva o nome e função de cada irmão e depois gere a imagem!
        </div>
      </div>

      <div class="flex flex-col gap-3 pt-4 border-t border-red-100">
        <button id="btn-generate-report" class="w-full bg-[#94a3b8] text-white font-bold py-3 rounded-lg shadow-md flex items-center justify-center gap-2 hover:bg-[#64748b] transition-colors">
          <i class="fas fa-image"></i> Gerar Imagem da Presença
        </button>
        <a href="/other-apps.html" class="w-full bg-white text-[#8f1919] font-bold py-3 rounded-lg border border-[#8f1919] flex items-center justify-center gap-2 hover:bg-red-50 transition-colors">
          <i class="fas fa-arrow-left"></i> Voltar
        </a>
      </div>

      <div id="service-preview-section" class="w-full mt-6 bg-white rounded-2xl shadow-xl p-6 border-2 border-red-50 hidden">
        <h3 class="text-[#8f1919] font-bold text-xl mb-4 text-center">Visualização</h3>
        <div class="bg-slate-100 p-4 rounded-xl flex justify-center mb-6">
          <img id="service-preview-image" alt="Preview Relatório" class="max-w-full h-auto shadow-md rounded" />
        </div>
        <div class="flex flex-col sm:flex-row gap-4">
          <button id="btn-share-service" class="flex-1 bg-[#25d366] text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-3">
            <i class="fab fa-whatsapp text-2xl"></i> COMPARTILHAR
          </button>
          <button id="btn-download-service" class="flex-1 bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-3">
            <i class="fas fa-download"></i> BAIXAR
          </button>
        </div>
      </div>

    </div>

    <!-- Script de controle de seleção exclusiva -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const buttons = document.querySelectorAll('.cult-type-btn');
        
        buttons.forEach(btn => {
          btn.addEventListener('click', (e) => {
            // Previne conflitos com o script principal se necessário
            e.preventDefault();
            
            // Remove a classe active e limpa estilos inline de todos os botões
            buttons.forEach(b => {
              b.classList.remove('active');
              b.style.backgroundColor = '';
              b.style.color = '';
              b.style.borderColor = '';
            });
            
            // Ativa apenas o botão clicado
            btn.classList.add('active');
            btn.style.backgroundColor = '#8f1919';
            btn.style.color = '#ffffff';
            btn.style.borderColor = '#8f1919';
            
            // Dispara um evento de clique simulado caso o TS escute o ID específico
            const clickEvent = new Event('click', { bubbles: true });
            // Se o TS escutar o elemento original, isso ajuda a manter a lógica interna dele sincronizada
          });
        });
      });
    </script>

    <script type="module" src="/service-attendance.ts"></script>
  </body>
</html>
