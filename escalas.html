<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escalas - Gestão Culto Profético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #fff5f5; 
        color: #1e293b; 
      }
      .glass-card-pro {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.85);
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      }
      .glass-card-pro:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-[#fff5f5] flex flex-col items-center pt-8 pb-12 px-6">
      
      <!-- Cabeçalho -->
      <header class="w-full max-w-md flex items-center gap-4 mb-6">
        <a href="/home.html" class="text-[#8f1919] p-2 bg-white rounded-full shadow-sm flex items-center justify-center w-10 h-10 active:scale-95 transition-transform">
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-2xl font-bold text-[#8f1919] uppercase">Escalas</h1>
      </header>

      <!-- Lista de Botões de Escalas -->
      <div class="max-w-md w-full space-y-3.5">
        
        <!-- Escala de Obreiros -->
        <a href="#" class="w-full glass-card-pro p-4 rounded-[1.5rem] flex items-center gap-4 group">
          <div class="w-12 h-12 rounded-2xl bg-red-100 flex items-center justify-center text-[#8f1919] shrink-0 group-hover:scale-105 transition-transform">
            <i class="fas fa-users text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-base font-extrabold text-[#7f1d1d] leading-tight">Escala de Obreiros</h3>
            <p class="text-red-400 text-xs font-semibold mt-0.5">Gerenciar obreiros na escala</p>
          </div>
        </a>

        <!-- Escala Quinzenais -->
        <a href="#" class="w-full glass-card-pro p-4 rounded-[1.5rem] flex items-center gap-4 group">
          <div class="w-12 h-12 rounded-2xl bg-red-100 flex items-center justify-center text-[#8f1919] shrink-0 group-hover:scale-105 transition-transform">
            <i class="fas fa-calendar-week text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-base font-extrabold text-[#7f1d1d] leading-tight">Escala Quinzenais</h3>
            <p class="text-red-400 text-xs font-semibold mt-0.5">Gerenciar turnos quinzenais</p>
          </div>
        </a>

        <!-- Escala de Flores -->
        <a href="#" class="w-full glass-card-pro p-4 rounded-[1.5rem] flex items-center gap-4 group">
          <div class="w-12 h-12 rounded-2xl bg-red-100 flex items-center justify-center text-[#8f1919] shrink-0 group-hover:scale-105 transition-transform">
            <i class="fas fa-seedling text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-base font-extrabold text-[#7f1d1d] leading-tight">Escala de Flores</h3>
            <p class="text-red-400 text-xs font-semibold mt-0.5">Organização da decoração floral</p>
          </div>
        </a>

        <!-- Escala Instrumentistas -->
        <a href="#" class="w-full glass-card-pro p-4 rounded-[1.5rem] flex items-center gap-4 group">
          <div class="w-12 h-12 rounded-2xl bg-red-100 flex items-center justify-center text-[#8f1919] shrink-0 group-hover:scale-105 transition-transform">
            <i class="fas fa-guitar text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-base font-extrabold text-[#7f1d1d] leading-tight">Escala Instrumentistas</h3>
            <p class="text-red-400 text-xs font-semibold mt-0.5">Músicos e instrumentistas</p>
          </div>
        </a>

      </div>

      <!-- Botão Voltar -->
      <div class="max-w-md w-full mt-6">
        <a href="/home.html" class="w-full bg-white text-[#8f1919] font-bold py-3.5 rounded-2xl border border-red-200 block text-center shadow-sm active:scale-95 transition-all">Voltar ao Início</a>
      </div>

    </div>
  </body>
</html>
