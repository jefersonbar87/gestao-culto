<!DOCTYPE html>
<html lang="pt-BR" translate="no">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#8f1919" />
    <title>Carregando... - ICM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            background-color: #fce8e8;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .splash-logo-anim {
            opacity: 0;
            transform: scale(0.4);
            animation: logoReveal 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes logoReveal {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>

<body class="fixed inset-0 flex items-center justify-center px-4">
    <!-- Camada vermelha por cima que vai esmaecer -->
    <div id="splash-red-bg" class="absolute inset-0 bg-[#8f1919] opacity-90 transition-opacity duration-500"></div>

    <!-- Imagem da Logomarca -->
    <img id="splash-logo" src="./logo-gestao.png" alt="Logomarca Gestão"
        class="relative z-10 w-64 md:w-80 object-contain splash-logo-anim transition-opacity duration-500 -mt-10" />

    <!-- Rodapé Fixo Proporcional Correto -->
    <footer id="splash-footer" class="absolute bottom-5 left-0 w-full z-20 flex flex-col items-center justify-center fade-out" style="opacity: 1; transition: opacity 0.5s ease-in-out;">
        <div class="flex flex-col items-center select-none gap-0.5">
            <!-- Desenvolvido por discreto -->
            <span class="text-[10px] font-medium text-white/70 tracking-wider mb-0.5">
                Desenvolvido por:
            </span>
            <!-- Nome da Marca em Destaque -->
            <div class="text-base md:text-lg font-black tracking-tight flex items-center drop-shadow-sm">
                <span class="text-slate-900 font-extrabold">Jef</span><span class="text-[#00b4d8] font-black">Tecnologias</span>
            </div>
            <!-- Linha Gradiente -->
            <div class="w-28 h-[1.5px] bg-gradient-to-r from-transparent via-[#00b4d8] to-transparent my-0.5 opacity-80"></div>
            <!-- Subtítulo Bem Delicado e Menor -->
            <span class="text-[6px] md:text-[9px] font-bold text-slate-400 tracking-[0.2em] uppercase">
                SOLUÇÕES INTELIGENTES
            </span>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Aguarda o tempo de exibição do splash
            setTimeout(() => {
                // Esmaece a camada vermelha, a logo e o rodapé juntos
                document.getElementById('splash-red-bg').classList.add('fade-out');
                document.getElementById('splash-logo').classList.add('fade-out');
                document.getElementById('splash-footer').classList.add('fade-out');

                // Assim que o esmaecimento termina (0.5s), pula para a home
                setTimeout(() => {
                    window.location.replace('./home.html');
                }, 500);
            }, 2500);
        });
    </script>
</body>

</html>
