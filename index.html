<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#8f1919" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Culto ICM" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/google/material-design-icons/master/png/action/settings/android/res/mipmap-xxxhdpi/ic_launcher_settings_f9_24dp.png" />
    
    <title>Sistema Culto Profético - ICM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      body { 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        padding: 0; 
        background-color: #fce8e8; 
        background-image: url("data:image/svg+xml,%3Csvg width='42' height='44' viewBox='0 0 42 44' xmlns='http://www.w3.org/2000/svg'%3E%3Cg id='Page-1' fill='none' fill-rule='evenodd'%3E%3Cg id='brick-wall' fill='%238f1919' fill-opacity='0.15'%3E%3Cpath d='M0 0h42v44H0V0zm1 1h40v20H1V1zM0 23h20v20H0V23zm22 0h20v20H22V23z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        color: #1e293b; 
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      /* Otimizações para mobile standalone */
      @media (display-mode: standalone) {
        body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen flex flex-col items-center animate-fade-in pb-12">
      <!-- Header Section -->
      <div class="w-full flex flex-col items-center text-center pt-10 pb-8 px-6">
        <img 
          id="app-logo"
          src="./icmplaca.png" 
          alt="Logo ICM" 
          class="h-28 mb-4 drop-shadow-sm transition-all active:scale-95 cursor-pointer select-none" 
        />
        <h1 class="text-4xl md:text-5xl font-bold text-[#8f1919] tracking-tight leading-tight">
          Sistema Culto<br />Profético
        </h1>
        <p class="text-[#b91c1c] text-xl mt-4 font-medium">
          Igreja Cristã Maranata
        </p>
      </div>

      <!-- Menu Options Section -->
      <div class="max-w-md w-full px-6 space-y-5">
        <a href="/hymns.html" class="w-full bg-white p-5 rounded-[1.8rem] shadow-md hover:shadow-lg transition-all duration-300 text-left flex items-center gap-5 border border-white/50 active:scale-[0.98] block">
          <div class="w-16 h-16 rounded-2xl bg-[#fde2e2] flex items-center justify-center text-[#8f1919] shrink-0">
            <i id="icon-hymns" class="fas fa-list-ul text-2xl"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-2xl font-bold text-[#8f1919] leading-tight">Lista de Louvores</h3>
            <p class="text-[#b91c1c] text-base font-medium">Organize os hinos do culto</p>
          </div>
        </a>

        <a href="/gifts.html" class="w-full bg-white p-5 rounded-[1.8rem] shadow-md hover:shadow-lg transition-all duration-300 text-left flex items-center gap-5 border border-white/50 active:scale-[0.98] block">
          <div class="w-16 h-16 rounded-2xl bg-[#fde2e2] flex items-center justify-center text-[#8f1919] shrink-0">
            <i id="icon-gifts" class="fas fa-id-card text-2xl"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-2xl font-bold text-[#8f1919] leading-tight">Registro de Dons</h3>
            <p class="text-[#b91c1c] text-base font-medium">Registre os dons espirituais</p>
          </div>
        </a>

        <a href="/other-apps.html" class="w-full bg-white p-5 rounded-[1.8rem] shadow-md hover:shadow-lg transition-all duration-300 text-left flex items-center gap-5 border border-white/50 active:scale-[0.98] block">
          <div class="w-16 h-16 rounded-2xl bg-[#fde2e2] flex items-center justify-center text-[#8f1919] shrink-0">
            <i id="icon-other" class="fas fa-th-large text-2xl"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-2xl font-bold text-[#8f1919] leading-tight">Outros Apps</h3>
            <p class="text-[#b91c1c] text-base font-medium">Outras funcionalidades</p>
          </div>
        </a>
        
        <a href="/chat.html" class="w-full bg-white p-5 rounded-[1.8rem] shadow-md hover:shadow-lg transition-all duration-300 text-left flex items-center gap-5 border border-white/50 active:scale-[0.98] block">
          <div class="w-16 h-16 rounded-2xl bg-[#fde2e2] flex items-center justify-center text-[#8f1919] shrink-0">
            <i id="icon-support" class="fas fa-question-circle text-2xl"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-2xl font-bold text-[#8f1919] leading-tight">Suporte do Sistema</h3>
            <p class="text-[#b91c1c] text-base font-medium">Tire dúvidas sobre o app</p>
          </div>
        </a>
      </div>

      <!-- Footer Branding -->
      <footer class="mt-auto pt-10 text-center flex flex-col items-center gap-4">
        <a 
          href="https://www.instagram.com/icmplanalto.linhares?igsh=NHBjeWU5aXBiOTR1" 
          target="_blank" 
          rel="noopener noreferrer"
          class="flex items-center gap-2 bg-white/50 px-4 py-2 rounded-full text-pink-600 font-bold text-xs shadow-sm"
        >
          <i class="fab fa-instagram"></i> Instagram ICM Planalto
        </a>

        <p class="text-[#8f1919] font-bold text-xs uppercase tracking-widest opacity-60">ICM Planalto - Linhares/ES</p>
      </footer>
    </div>

    <script type="module" src="/index.ts"></script>
  </body>
</html>
