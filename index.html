<!DOCTYPE html>
<html lang="pt-BR" translate="no">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#8f1919" />
    <title>Carregando... - ICM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            /* O fundo base agora é da mesma cor da sua tela home */
            background-color: #fce8e8;
            overflow: hidden;
        }

        .splash-logo-anim {
            opacity: 0;
            transform: scale(0.95);
            animation: logoReveal 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes logoReveal {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Classe para a transição de saída ficar suave */
        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>

<body class="fixed inset-0 flex items-center justify-center px-4">
    <!-- Camada vermelha por cima que vai esmaecer -->
    <div id="splash-red-bg" class="absolute inset-0 bg-[#8f1919] opacity-90 transition-opacity duration-500"></div>

    <!-- Imagem da Logomarca -->
    <img id="splash-logo" src="./logo-gestao.png" alt="Logomarca Gestão"
        class="relative z-10 w-64 md:w-80 object-contain splash-logo-anim transition-opacity duration-500" />

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Aguarda o tempo de exibição do splash
            setTimeout(() => {
                // Esmaece apenas a camada vermelha e a logo, revelando o fundo #fce8e8
                document.getElementById('splash-red-bg').classList.add('fade-out');
                document.getElementById('splash-logo').classList.add('fade-out');

                // Assim que o esmaecimento termina (0.5s), pula para a home
                setTimeout(() => {
                    window.location.replace('./home.html');
                }, 500);
            }, 2500);
        });
    </script>
</body>

</html>
