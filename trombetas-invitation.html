<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Convites - Trombetas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #0d2f40;
      color: #1e293b; 
    }
    .input-border { border: 1px solid #7dd3fc; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-8 pb-12 px-4">
  
  <div class="text-center mb-8">
    <h1 class="text-3xl font-black text-white mb-2 tracking-wide">Gerador de Convites</h1>
    <h2 class="text-lg font-medium text-white">Modelo Personalizado</h2>
  </div>

  <div class="w-full max-w-2xl space-y-5">
    
    <form id="form-invitation" class="bg-white rounded-xl shadow-lg p-6 space-y-4">
      <h3 class="text-[#0d2f40] font-bold text-lg flex items-center gap-2 border-b pb-2 mb-4">
        <i class="far fa-envelope-open"></i> Detalhes do Convite
      </h3>
      
      <div>
        <label class="text-xs font-bold text-[#0d2f40] block mb-1">Nome do Convidado *</label>
        <input type="text" id="invite-name" required placeholder="EX: JEFERSON" class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm focus:ring-2 focus:ring-[#0d2f40]/20" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-[#0d2f40] block mb-1">Data do Evento *</label>
          <input type="date" id="invite-date" required class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm focus:ring-2 focus:ring-[#0d2f40]/20" />
        </div>
        <div>
          <label class="text-xs font-bold text-[#0d2f40] block mb-1">Horário *</label>
          <input type="time" id="invite-time" required class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm focus:ring-2 focus:ring-[#0d2f40]/20" />
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-[#0d2f40] block mb-1">Local / Cidade *</label>
        <input type="text" id="invite-location" required placeholder="EX: LINHARES" class="w-full input-border rounded-lg p-2.5 outline-none text-slate-600 text-sm focus:ring-2 focus:ring-[#0d2f40]/20" />
      </div>

      <button type="submit" class="w-full bg-[#dc2626] text-white font-bold py-3.5 rounded-lg flex items-center justify-center gap-2 hover:bg-red-700 transition-colors shadow-md">
        <i class="fas fa-magic"></i> Criar Convite Oficial
      </button>
    </form>

    <div id="preview-section" class="w-full bg-white rounded-xl shadow-lg p-6 hidden">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 class="text-[#0d2f40] font-bold text-lg">Convite Pronto</h3>
        <button id="btn-close-preview" class="w-7 h-7 bg-red-50 text-red-500 rounded-full flex items-center justify-center hover:bg-red-100 transition-colors">
          <i class="fas fa-times text-xs"></i>
        </button>
      </div>
      
      <div class="bg-slate-50 border border-slate-200 p-2 flex justify-center mb-4 rounded">
        <img id="generated-invite-img" class="max-w-full h-auto shadow-sm rounded border border-slate-300" style="max-height: 600px; object-fit: contain;" />
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <button id="btn-share-whatsapp" class="bg-[#22c55e] text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-green-600 transition-colors">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </button>
        <button id="btn-download-invite" class="bg-[#3b82f6] text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-blue-600 transition-colors">
          <i class="fas fa-download"></i> Baixar
        </button>
      </div>
    </div>

    <div class="pt-2">
      <a href="/trombetas.html" class="w-full bg-white text-[#0d2f40] font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors shadow-md">
        <i class="fas fa-arrow-left"></i> Voltar
      </a>
    </div>

  </div>

  <script type="module" src="/trombetas-invitation.ts"></script>
</body>
</html>
