<!DOCTYPE html>
<html lang="pt-BR" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#8f1919" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gestão ICM" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon"
    href="https://raw.githubusercontent.com/google/material-design-icons/master/png/action/settings/android/res/mipmap-xxxhdpi/ic_launcher_settings_f9_24dp.png" />

  <title>Gestão Culto Profético - ICM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1a0505;
      background-image: url('./fundo-igreja.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #1e293b;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Estilo de vidro translúcido moderno compactado proporcionalmente */
    .glass-card-pro {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 255, 255, 0.25) inset;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .glass-card-pro:active {
      transform: scale(0.96);
    }

    /* Ocultar barra de rolagem visualmente mantendo a fluidez */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media (display-mode: standalone) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>

<body>
  <!-- CABEÇALHO FIXO TRANSPARENTE COM A LOGO MAIS ALTA -->
  <header class="fixed top-0 left-0 w-full z-30 bg-gradient-to-b from-[#1a0505]/95 via-[#1a0505]/50 to-transparent pt-0 pb-6 px-6 flex justify-center items-center pointer-events-none">
    <img src="/logo-gestao.png" alt="Gestão Culto Profético" class="h-32 md:h-36 w-auto object-contain drop-shadow-[0_4px_12px_rgba(0,0,0,0.98)] scale-125 -mt-3" />
  </header>

  <!-- ÁREA DE CONTEÚDO COM A POSIÇÃO MILIMÉTRICA TRAVADA -->
  <main class="absolute top-52 bottom-14 left-0 w-full overflow-y-auto no-scrollbar flex flex-col items-center px-5 z-10">
    <div class="max-w-md w-full flex flex-col gap-2.5 py-2">
      
      <!-- Fileira 1: Lista de Louvores e Registro de Dons -->
      <div class="grid grid-cols-2 gap-2.5">
        <a href="/hymns.html" class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform">
            <i class="fas fa-list-ul text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Lista de Louvores</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Organize os hinos</p>
          </div>
        </a>

        <a href="/gifts.html" class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform">
            <i class="fas fa-id-card text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Registro de Dons</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Dons espirituais</p>
          </div>
        </a>
      </div>

      <!-- Fileira 2: Dados do Culto e Trombetas & Festas -->
      <div class="grid grid-cols-2 gap-2.5">
        <a href="/cult-data.html" class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform">
            <i class="fas fa-book-open text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Dados do Culto</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Relatórios e presenças</p>
          </div>
        </a>

        <a href="/trombetas.html" class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform p-1.5">
            <img src="/icone-trombetas.png" alt="Trombetas & Festas" class="w-full h-full object-contain opacity-95" />
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Trombetas & Festas</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Dados e convites</p>
          </div>
        </a>
      </div>

      <!-- Fileira 3: Escalas e Convites -->
      <div class="grid grid-cols-2 gap-2.5">
        <a href="/escalas.html" class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform">
            <i class="fas fa-calendar-alt text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Escalas</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Criação de Escalas</p>
          </div>
        </a>

        <a href="/convites.html" class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform">
            <i class="fas fa-envelope-open-text text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Convites</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Criação de Convites</p>
          </div>
        </a>
      </div>

      <!-- Fileira 4: Oração Ininterrupta e Recurso 9 -->
      <div class="grid grid-cols-2 gap-2.5">
        <a href="https://oracao24hicm.web.app" target="_blank" rel="noopener noreferrer"
          class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform">
            <i class="fas fa-clock text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Oração Ininterrupta</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Lista de Oração</p>
          </div>
        </a>

        <a href="#" class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group opacity-75">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform">
            <i class="fas fa-star text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Recurso 9</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Em breve</p>
          </div>
        </a>
      </div>

      <!-- Fileira 5: Suporte -->
      <div class="grid grid-cols-2 gap-2.5">
        <a href="/chat.html" class="w-full glass-card-pro p-3 rounded-[1.5rem] flex flex-col items-center text-center justify-between group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100/90 to-red-200/90 flex items-center justify-center text-[#8f1919] shadow-md mb-1.5 group-hover:scale-110 transition-transform">
            <i class="fas fa-question-circle text-lg"></i>
          </div>
          <div class="flex flex-col">
            <h3 class="text-xs font-extrabold text-[#7f1d1d] leading-tight">Suporte</h3>
            <p class="text-[#991b1b] text-[10px] font-semibold mt-0.5 opacity-90">Dúvidas sobre o app</p>
          </div>
        </a>
      </div>

    </div>
  </main>

  <!-- RODAPÉ FIXO TRANSPARENTE E LIMPO -->
  <footer class="fixed bottom-0 left-0 w-full h-12 bg-gradient-to-t from-[#1a0505]/90 via-[#1a0505]/40 to-transparent z-30 pointer-events-none"></footer>

  <!-- Container Oculto para PWA -->
  <div id="pwa-install-container" class="hidden absolute top-5 right-5">
    <button id="btn-install-pwa"></button>
  </div>

  <!-- Script de Controle PWA -->
  <script>
    let deferredPrompt = null;
    const installContainer = document.getElementById('pwa-install-container');
    const btnInstallPwa = document.getElementById('btn-install-pwa');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installContainer) {
        installContainer.classList.remove('hidden');
      }
    });

    if (btnInstallPwa) {
      btnInstallPwa.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('App instalado com sucesso!');
        }
        deferredPrompt = null;
        if (installContainer) {
          installContainer.classList.add('hidden');
        }
      });
    }

    window.addEventListener('appinstalled', () => {
      if (installContainer) {
        installContainer.classList.add('hidden');
      }
    });
  </script>

  <script type="module" src="/index.ts"></script>
</body>

</html>
